# OCR review — AI code review on every PR.
#
# Flow: PR opened/synchronize/reopened -> build base..head diff -> POST to
# dev-02 `ocr-dispatch` -> render Markdown -> create/update ONE PR comment
# tagged <!-- ocr-review -->.
#
# Why self-hosted: the dispatch service lives on nyan-dev-02 and its UFW only
# admits tailscale0, so a GitHub-hosted runner cannot reach it. The
# self-hosted dev-01 runner can. Fork PRs must NOT run on self-hosted (those
# users hold NOPASSWD sudo and the docker group), so they are skipped with a
# note instead — same trust split as ci.yml.
#
# Secrets needed (repo Settings -> Secrets and variables -> Actions):
#   OCR_DISPATCH_URL    default http://100.80.19.12:50007/ocr  (tailnet + nginx)
#   OCR_DISPATCH_TOKEN  must equal /etc/ocr-dispatch.token on dev-02
#
# The dispatch server holds the CPA key. The runner only ships the diff and
# receives the rendered comment; the model credential never leaves dev-02.

name: OCR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review (OCR)
    # Compare repository full names rather than head.repo.fork: this repository
    # is itself a fork, so `fork` is true for every PR. Mirrors ci.yml.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","repo-Netcatty"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Guard — fork PRs cannot reach the dispatch service
        id: guard
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR: skipping OCR review (dispatch is tailnet-only)."
          fi

      - name: Checkout PR head with base history
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR diff
        if: steps.guard.outputs.skip != 'true'
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE" "$HEAD"
          # Three-dot (merge-base) is what GitHub shows in "Files changed".
          if ! git diff "$BASE"...'$HEAD' > /tmp/pr.diff 2>/dev/null; then
            git diff "$BASE" "$HEAD" > /tmp/pr.diff
          fi
          echo "lines=$(wc -l < /tmp/pr.diff)" >> "$GITHUB_OUTPUT"
          [ -s /tmp/pr.diff ] || echo "empty=true" >> "$GITHUB_OUTPUT"

      - name: Request review from ocr-dispatch
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.empty != 'true'
        env:
          URL: ${{ secrets.OCR_DISPATCH_URL || 'http://100.80.19.12:50007/ocr' }}
          TOKEN: ${{ secrets.OCR_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          diff = open('/tmp/pr.diff', encoding='utf-8').read()
          payload = json.dumps({
              "repo": os.environ["REPO"],
              "sha": os.environ["SHA"],
              "base_sha": os.environ["BASE"],
              "diff": diff,
              "model": "deepseek-flash",
              "effort": "low",
          }).encode()
          req = urllib.request.Request(
              os.environ["URL"].rstrip('/') + '/review',
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["TOKEN"],
              },
              method='POST')
          try:
              with urllib.request.urlopen(req, timeout=700) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as exc:
              data = {"ok": False, "error": "HTTP %s: %s" % (exc.code, exc.read(200)[:200])}
          except Exception as exc:  # noqa: BLE001
              data = {"ok": False, "error": "dispatch unreachable: %s" % exc}

          if data.get("ok"):
              body = data.get("comment") or ""
          else:
              body = ("<!-- ocr-review -->\n\n> ⚠️ OCR review 未能完成：%s\n"
                      "\n<sub>可重跑本 workflow，或检查 dev-02 的 `ocr-dispatch`。</sub>\n"
                      % data.get("error", "unknown"))
          open('/tmp/ocr_comment.md', 'w', encoding='utf-8').write(body)
          print("dispatch ok=%s error=%s" % (data.get("ok"), data.get("error")))
          PY

      - name: Post or update the PR comment
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.empty != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ocr-review -->';
            const body = fs.readFileSync('/tmp/ocr_comment.md', 'utf8');
            if (!body.includes(marker)) {
              core.warning('rendered comment lacks the marker; refusing to post');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c =>
              c.body && c.body.includes(marker) &&
              c.user && c.user.type === 'Bot');
            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
              core.info(`updated comment ${mine.id}`);
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
              core.info('created OCR review comment');
            }
